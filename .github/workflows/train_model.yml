name: Pretrain Text Model

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Model name (used as <model_name>.bin)"
        required: true
        default: "model"
  push:
    branches: [ main, master ]
    paths:
      - "dataset.zip"
      - ".github/workflows/train-model.yml"
      - "train.py"

# Satu job agar output zip mudah diambil.
# Dataset harus di-repo sebagai dataset.zip (bisa dipush manual).
# Semua .jsonl di dalam dataset.zip akan diekstrak dan dipakai training.

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Extract dataset.zip
        run: |
          set -e
          if [ ! -f dataset.zip ]; then
            echo "::error::dataset.zip tidak ditemukan di root repo. Push dataset.zip ke root dulu."
            exit 1
          fi
          mkdir -p dataset_extracted
          python - <<'PY'
          import zipfile, pathlib
          root = pathlib.Path("dataset_extracted")
          with zipfile.ZipFile("dataset.zip") as z:
              # ekstrak semua file di dalam zip
              for name in z.namelist():
                  target = root / name
                  # mencegah zip-slip
                  target = (root / name).resolve()
                  root = root.resolve()
                  if not str(target).startswith(str(root)):
                      raise RuntimeError(f"Unzip path escape: {name}")
                  if name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(name))
          print("Ekstrak dataset.zip selesai ke:", root)
          PY

      - name: Run pretrain
        env:
          MODEL_NAME: ${{ inputs.model_name || 'model' }}
        run: |
          python train.py --model-name "${MODEL_NAME}"

      - name: Verify output
        run: |
          set -e
          [ -f "${MODEL_NAME:-model}.bin" ]
          [ -f manifest.json ]
          unzip -l output.zip || true
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("manifest.json").read_text())
          assert m["format"] == "mini-lab-ai-model", "format salah"
          assert m["model"]["file"].endswith(".bin"), "model file harus .bin"
          assert m["model"]["architecture"] == "TinyLM-ContextMLP"
          print("Manifest OK:", m["model"]["name"])
          PY

      - name: Upload final ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pretrained-model
          path: |
            output.zip
          if-no-files-found: error
