name: Model Pre-Training Pipeline

on:
  workflow_dispatch: # Dapat dijalankan secara manual dari tab Actions

jobs:
  pretrain:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run Pre-Training Script
        run: |
          python train.py

      - name: Create Final Zip Archive
        run: |
          mkdir -p dist
          # Membungkus file .bin dan manifest.json ke dalam zip sesuai permintaan
          zip -j dist/model-output.zip output/*.bin output/manifest.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-package
          path: dist/model-output.zip
