name: Pretrain TinyLM Model

on:
  workflow_dispatch:
    inputs:
      context_window:
        description: 'Context Window Size'
        required: true
        default: '256'
      batch_size:
        description: 'Micro-batch Size'
        required: true
        default: '16'
      grad_accum:
        description: 'Gradient Accumulation Steps'
        required: true
        default: '1'
      max_steps:
        description: 'Max Optimizer Steps'
        required: true
        default: '3000'
      vocab_size:
        description: 'Vocabulary Size'
        required: true
        default: '10000'
      n_layer:
        description: 'Number of Transformer Layers'
        required: true
        default: '4'
      n_head:
        description: 'Number of Attention Heads'
        required: true
        default: '4'
      dim_d:
        description: 'Embedding Dimension (must be divisible by n_head)'
        required: true
        default: '256'
      dim_h:
        description: 'Feedforward Hidden Dimension'
        required: true
        default: '1024'
      lr:
        description: 'Peak Learning Rate'
        required: true
        default: '3e-4'

concurrency:
  group: pretrain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pretrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch tqdm

      - name: Extract Dataset
        run: |
          if [ ! -f dataset.zip ]; then
            echo "ERROR: dataset.zip not found in repository root."
            exit 1
          fi
          unzip -q dataset.zip -d dataset_extracted
          echo "Dataset extracted successfully."
          ls -lh dataset_extracted

      - name: Run Pretraining
        env:
          CONTEXT_WINDOW:   ${{ github.event.inputs.context_window }}
          BATCH_SIZE:       ${{ github.event.inputs.batch_size }}
          GRAD_ACCUM:       ${{ github.event.inputs.grad_accum }}
          MAX_STEPS:        ${{ github.event.inputs.max_steps }}
          VOCAB_SIZE:       ${{ github.event.inputs.vocab_size }}
          N_LAYER:          ${{ github.event.inputs.n_layer }}
          N_HEAD:           ${{ github.event.inputs.n_head }}
          DIM_D:            ${{ github.event.inputs.dim_d }}
          DIM_H:            ${{ github.event.inputs.dim_h }}
          LR:               ${{ github.event.inputs.lr }}
          MAX_OUTPUT_TOKENS: 2084
          CHECKPOINT_INTERVAL: 100
          WARMUP_STEPS: 500
          WEIGHT_DECAY: 0.1
          GRAD_CLIP: 1.0
          DROPOUT: 0.1
          NUM_WORKERS: 2
        run: |
          python train.py \
            --data_dir dataset_extracted \
            --context_window $CONTEXT_WINDOW \
            --batch_size $BATCH_SIZE \
            --grad_accum $GRAD_ACCUM \
            --max_steps $MAX_STEPS \
            --vocab_size $VOCAB_SIZE \
            --n_layer $N_LAYER \
            --n_head $N_HEAD \
            --dim_d $DIM_D \
            --dim_h $DIM_H \
            --lr $LR \
            --warmup_steps $WARMUP_STEPS \
            --weight_decay $WEIGHT_DECAY \
            --grad_clip $GRAD_CLIP \
            --dropout $DROPOUT \
            --num_workers $NUM_WORKERS \
            --max_output_tokens $MAX_OUTPUT_TOKENS \
            --checkpoint_every $CHECKPOINT_INTERVAL

      - name: Debug — list checkpoints
        if: always()
        run: |
          echo "=== checkpoints/ ==="
          ls -lah checkpoints/ 2>/dev/null || echo "(checkpoints/ not found)"
          echo "=== checkpoints/final/ ==="
          ls -lah checkpoints/final/ 2>/dev/null || echo "(checkpoints/final/ not found)"

      - name: Package Final Model
        if: always()
        run: |
          mkdir -p release
          if ls checkpoints/final/*.bin >/dev/null 2>&1; then
            cp checkpoints/final/*.bin release/
          else
            echo "WARNING: No .bin file found in checkpoints/final/"
            exit 1
          fi
          cp checkpoints/final/manifest.json release/ 2>/dev/null || echo "WARNING: manifest.json not found"
          cd release
          zip -r ../kicau-model-release.zip .
          cd ..
          ls -lh kicau-model-release.zip

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicau-pretrained-model
          path: kicau-model-release.zip
          retention-days: 30
          if-no-files-found: warn
