name: TinyLM Chat Inference

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Pesan untuk model (akan disimpan ke chat.txt)'
        required: true
        default: 'Hello, tell me about the garden'
      artifact_url:
        description: 'URL Artifact model (.zip)'
        required: true
        default: 'https://github.com/azrielspace852-wq/Database-001/actions/runs/38782894194/artifacts/11998050399'

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Create chat.txt from input
        run: |
          cat > chat.txt << 'EOF'
          ${{ github.event.inputs.prompt }}
          EOF
          echo "📝 chat.txt created:"
          cat chat.txt

      - name: Download Model Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_URL="${{ github.event.inputs.artifact_url }}"

          # Parse URL: https://github.com/OWNER/REPO/actions/runs/RUN_ID/artifacts/ARTIFACT_ID
          REPO=$(echo "$ARTIFACT_URL" | sed -E 's|https://github.com/([^/]+/[^/]+)/actions/.*|\1|')
          RUN_ID=$(echo "$ARTIFACT_URL" | grep -oP 'runs/\K[0-9]+')
          ARTIFACT_ID=$(echo "$ARTIFACT_URL" | grep -oP 'artifacts/\K[0-9]+')

          echo "Repo:        $REPO"
          echo "Run ID:      $RUN_ID"
          echo "Artifact ID: $ARTIFACT_ID"

          # Ambil nama artifact dari API
          ARTIFACT_NAME=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/artifacts/$ARTIFACT_ID" \
            --jq '.name')

          echo "Artifact name: $ARTIFACT_NAME"

          # gh run download handle redirect otomatis (beda dengan gh api)
          gh run download "$RUN_ID" \
            --repo "$REPO" \
            --name "$ARTIFACT_NAME" \
            --dir model_download

          echo "=== Downloaded contents ==="
          find model_download -type f

          # Cari zip di dalam artifact
          INNER_ZIP=$(find model_download -name "*.zip" -type f | head -1)
          if [ -z "$INNER_ZIP" ]; then
            echo "ERROR: No .zip inside artifact"
            exit 1
          fi
          echo "Inner zip: $INNER_ZIP"
          cp "$INNER_ZIP" model_artifact.zip
          ls -lh model_artifact.zip
          echo "✅ Artifact ready"

      - name: Run Inference
        run: python inference.py model_artifact.zip chat.txt response.txt

      - name: Display Response
        if: always()
        run: |
          echo "========================================="
          echo "🤖 MODEL RESPONSE:"
          echo "========================================="
          cat response.txt 2>/dev/null || echo "(response.txt not found)"
          echo ""
          echo "========================================="

      - name: Upload Response Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-response
          path: |
            response.txt
            chat.txt
          retention-days: 7
          if-no-files-found: warn
